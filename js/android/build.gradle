// React Native bridge for print-nats-sdk. Autolinked into the host app, where React Native is available.
// Works with the old bridge (RN 0.63) and New Architecture interop (RN 0.76).
buildscript {
    // Only when built on its own (compile check in print-nats-sdk); inside a host app the host's AGP is used —
    // pinning 3.5.4 here would clash with an AGP 8 host (maghilOrder).
    if (project == rootProject || rootProject.name == 'print-nats-sdk') {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:3.5.4'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// AGP 7+ has android.namespace and AGP 8 rejects manifest package=; AGP 3.5 (MerchantApp) needs the package attribute.
// Same detection as other RN libraries (no com.android.Version on AGP 3.5).
def supportsNamespace() {
    return project.android.hasProperty('namespace')
}

// Installed from git (the whole repo sits in node_modules/@merchant/print-nats): compile the SDK core + Android
// module straight from their sources into this bridge — no Maven publish needed (user 2026-09-24 "use that build
// direct from git"). AGP 7+ hosts only (manifest merge below uses namespaces). Otherwise (file:../print-nats-sdk/js,
// AGP 3.5 hosts, or -PprintNatsFromMaven) the published com.magilhub:print-nats-android artifact is used as before.
def sdkRoot = file("${projectDir}/../..")
def buildFromSource = rootProject.name != 'print-nats-sdk' &&
        new File(sdkRoot, 'core/src/main/java').exists() &&
        !rootProject.hasProperty('printNatsFromMaven')

android {
    if (supportsNamespace()) {
        namespace "com.magilhub.printnats.rn"
        sourceSets {
            main {
                manifest.srcFile(buildFromSource ? "src/main/AndroidManifestSourceNew.xml" : "src/main/AndroidManifestNew.xml")
                if (buildFromSource) {
                    java.srcDirs += ["${sdkRoot}/core/src/main/java", "${sdkRoot}/android/src/main/java"]
                    res.srcDirs += ["${sdkRoot}/android/src/main/res"]
                    assets.srcDirs += ["${sdkRoot}/android/src/main/assets"]
                }
            }
        }
    }
    compileSdkVersion safeExtGet('compileSdkVersion', 31)
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 31)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenLocal()   // ./gradlew :android:publishToMavenLocal in print-nats-sdk during development
    google()
    mavenCentral()
    if (rootProject.hasProperty('rnHost')) {
        // compile-check inside print-nats-sdk: React Native from the host's node_modules
        maven { url "${rootProject.file(rootProject.property('rnHost'))}/node_modules/react-native/android" }
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    if (rootProject.name == 'print-nats-sdk') {
        implementation project(':android')
    } else if (buildFromSource && supportsNamespace()) {
        // The core + android modules' own dependencies (core/build.gradle, android/build.gradle).
        implementation('io.nats:jnats:2.26.2') { exclude group: 'org.bouncycastle' }
        implementation 'com.google.code.gson:gson:2.8.9'
        implementation 'org.threeten:threetenbp:1.6.8'
        implementation 'com.starmicronics:stario:2.10.1'
        implementation 'com.starmicronics:starioextension:1.15.1'
        implementation 'com.google.zxing:core:3.4.1'
        implementation 'androidx.annotation:annotation:1.3.0'
        compileOnly 'androidx.room:room-common:2.4.3'
    } else {
        implementation "com.magilhub:print-nats-android:${safeExtGet('printNatsVersion', '0.1.0-SNAPSHOT')}"
    }
}
