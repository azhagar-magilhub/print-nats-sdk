// React Native bridge for print-nats-sdk. Autolinked into the host app, where React Native is available.
// Works with the old bridge (RN 0.63) and New Architecture interop (RN 0.76).
buildscript {
    // Only when built on its own (compile check in print-nats-sdk); inside a host app the host's AGP is used —
    // pinning 3.5.4 here would clash with an AGP 8 host (maghilOrder).
    if (project == rootProject || rootProject.name == 'print-nats-sdk') {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:3.5.4'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// AGP 7+ has android.namespace and AGP 8 rejects manifest package=; AGP 3.5 (MerchantApp) needs the package attribute.
// Same detection as other RN libraries (no com.android.Version on AGP 3.5).
def supportsNamespace() {
    return project.android.hasProperty('namespace')
}

android {
    if (supportsNamespace()) {
        namespace "com.magilhub.printnats.rn"
        sourceSets {
            main {
                manifest.srcFile "src/main/AndroidManifestNew.xml"
            }
        }
    }
    compileSdkVersion safeExtGet('compileSdkVersion', 31)
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 31)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenLocal()   // ./gradlew :android:publishToMavenLocal in print-nats-sdk during development
    google()
    mavenCentral()
    if (rootProject.hasProperty('rnHost')) {
        // compile-check inside print-nats-sdk: React Native from the host's node_modules
        maven { url "${rootProject.file(rootProject.property('rnHost'))}/node_modules/react-native/android" }
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    if (rootProject.name == 'print-nats-sdk') {
        implementation project(':android')
    } else {
        implementation "com.magilhub:print-nats-android:${safeExtGet('printNatsVersion', '0.1.0-SNAPSHOT')}"
    }
}
