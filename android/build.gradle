apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// Must stay loadable by MerchantApp: AGP 3.5.4, compileSdk 31, minSdk 24, Java 8.
android {
    compileSdkVersion 31
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 31
        versionName version
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    api project(':core')
    implementation 'com.starmicronics:stario:2.10.1'
    implementation 'com.starmicronics:starioextension:1.15.1'
    testImplementation "junit:junit:$junitVersion"
}

// AGP 3.5 has no `components.release`, so publish the AAR explicitly with its runtime dependencies.
afterEvaluate {
    publishing {
        publications {
            aar(MavenPublication) {
                groupId = 'com.magilhub'
                artifactId = 'print-nats-android'
                version = project.version
                artifact(tasks.getByName('bundleReleaseAar'))
                pom.withXml {
                    def deps = asNode().appendNode('dependencies')
                    [['com.magilhub', 'print-nats-core', project.version],
                     ['com.starmicronics', 'stario', '2.10.1'],
                     ['com.starmicronics', 'starioextension', '1.15.1']].each { d ->
                        def n = deps.appendNode('dependency')
                        n.appendNode('groupId', d[0])
                        n.appendNode('artifactId', d[1])
                        n.appendNode('version', d[2])
                        n.appendNode('scope', 'compile')
                    }
                }
            }
        }
    }
}
